name: Build Windows exe and Create Installer

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile src/watcher.py --name ticket-watcher
      - name: List workspace and dist (after pyinstaller)
        run: |
          echo "Workspace contents:"
          dir
          echo "Dist contents:"
          dir dist || echo "dist not found"
      - name: Install NSIS (for creating installer)
        run: |
          choco install nsis -y
          refreshenv || true
      - name: Build Windows installer with NSIS
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" -V2 installer\installer.nsi
      - name: List dist (after installer)
        run: |
          echo "Dist contents after installer:"
          dir dist || echo "dist not found"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ticket-watcher-artifacts
          path: dist/*.exe
      - name: Create Release and attach artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          files: dist/*.exe
